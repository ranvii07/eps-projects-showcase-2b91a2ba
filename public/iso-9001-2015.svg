<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="ISO 9001:2015 Certified Company">
  <title>ISO 9001:2015 Certified Company</title>
  <defs>
    <path id="iso-top" d="M 30 100 A 70 70 0 0 1 170 100" fill="none"/>
    <path id="iso-bottom" d="M 32 100 A 68 68 0 0 0 168 100" fill="none"/>
    <clipPath id="iso-globe-clip"><circle cx="100" cy="84" r="26"/></clipPath>
  </defs>

  <g fill="#1C6EB4">
    <circle cx="100" cy="100" r="94" fill="none" stroke="#1C6EB4" stroke-width="2.4"/>

    <text font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="4.5" text-anchor="middle">
      <textPath href="#iso-top" startOffset="50%">CERTIFIED</textPath>
    </text>
    <text font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="4.5" text-anchor="middle">
      <textPath href="#iso-bottom" startOffset="50%">COMPANY</textPath>
    </text>

    <circle cx="100" cy="100" r="64"/>
  </g>

  <g clip-path="url(#iso-globe-clip)" fill="none" stroke="#FFFFFF" stroke-width="1.6">
    <circle cx="100" cy="84" r="26"/>
    <ellipse cx="100" cy="84" rx="8.7" ry="26"/>
    <ellipse cx="100" cy="84" rx="17.5" ry="26"/>
    <ellipse cx="100" cy="84" rx="26" ry="8.7"/>
    <ellipse cx="100" cy="84" rx="26" ry="17.5"/>
  </g>

  <text x="100" y="107" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" text-anchor="middle" fill="#FFFFFF">ISO</text>
  <text x="100" y="141" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="0.3" text-anchor="middle" fill="#FFFFFF">9001:2015</text>
</svg>
